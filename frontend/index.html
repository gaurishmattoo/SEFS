<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SEFS — Semantic Entropy File System. A self-organizing file manager that dynamically clusters documents by meaning." />
  <title>SEFS — Semantic Entropy File System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- Particle canvas background -->
  <canvas id="particles-canvas"></canvas>

  <!-- Header -->
  <header id="app-header">
    <div class="header-left">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="16" stroke="url(#logoGrad)" stroke-width="2.5" opacity="0.6"/>
            <circle cx="14" cy="16" r="3" fill="#a78bfa"/>
            <circle cx="26" cy="14" r="2.5" fill="#6ee7b7"/>
            <circle cx="22" cy="26" r="3.5" fill="#f472b6"/>
            <circle cx="12" cy="26" r="2" fill="#fbbf24"/>
            <line x1="14" y1="16" x2="26" y2="14" stroke="#a78bfa" stroke-width="0.8" opacity="0.5"/>
            <line x1="14" y1="16" x2="22" y2="26" stroke="#f472b6" stroke-width="0.8" opacity="0.5"/>
            <line x1="26" y1="14" x2="22" y2="26" stroke="#6ee7b7" stroke-width="0.8" opacity="0.5"/>
            <line x1="12" y1="26" x2="14" y2="16" stroke="#fbbf24" stroke-width="0.8" opacity="0.5"/>
            <defs>
              <linearGradient id="logoGrad" x1="0" y1="0" x2="40" y2="40">
                <stop offset="0%" stop-color="#a78bfa"/>
                <stop offset="100%" stop-color="#6ee7b7"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="logo-text">
          <h1>SEFS</h1>
          <span class="subtitle">Semantic Entropy File System</span>
        </div>
      </div>
    </div>
    <div class="header-right">
      <div class="status-badge" id="status-badge">
        <span class="pulse"></span>
        <span class="status-text">Connecting…</span>
      </div>
      <button class="btn-recluster" id="btn-recluster" title="Force re-cluster">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 4v6h6M23 20v-6h-6"/>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main layout -->
  <div id="app-layout">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-inner">
        <!-- Upload zone -->
        <div class="upload-zone" id="upload-zone">
          <div class="upload-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <p>Drop files here<br/><span>or click to upload</span></p>
          <input type="file" id="file-input" accept=".pdf,.txt" multiple hidden />
        </div>

        <!-- Cluster list -->
        <div class="cluster-list" id="cluster-list">
          <h2>Semantic Clusters</h2>
          <div id="clusters-container">
            <!-- dynamically populated -->
          </div>
        </div>

        <!-- Stats -->
        <div class="stats-panel" id="stats-panel">
          <div class="stat">
            <span class="stat-value" id="stat-files">0</span>
            <span class="stat-label">Files</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="stat-clusters">0</span>
            <span class="stat-label">Clusters</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Graph viewport -->
    <main id="graph-viewport">
      <svg id="graph-svg"></svg>
      <!-- Tooltip -->
      <div class="tooltip" id="tooltip">
        <div class="tooltip-header">
          <span class="tooltip-icon"></span>
          <span class="tooltip-name"></span>
        </div>
        <div class="tooltip-body">
          <div class="tooltip-row"><span class="label">Cluster:</span><span class="value tooltip-cluster"></span></div>
          <div class="tooltip-row"><span class="label">Size:</span><span class="value tooltip-size"></span></div>
          <div class="tooltip-row"><span class="label">Type:</span><span class="value tooltip-type"></span></div>
        </div>
        <div class="tooltip-footer">Click to open file</div>
      </div>
      <!-- Empty state -->
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">
          <svg viewBox="0 0 80 80" fill="none">
            <circle cx="40" cy="40" r="35" stroke="url(#emptyGrad)" stroke-width="2" stroke-dasharray="6 4" opacity="0.4"/>
            <circle cx="30" cy="32" r="5" fill="#a78bfa" opacity="0.6"/>
            <circle cx="50" cy="30" r="4" fill="#6ee7b7" opacity="0.6"/>
            <circle cx="45" cy="50" r="6" fill="#f472b6" opacity="0.6"/>
            <circle cx="28" cy="50" r="3" fill="#fbbf24" opacity="0.6"/>
            <defs>
              <linearGradient id="emptyGrad" x1="0" y1="0" x2="80" y2="80">
                <stop offset="0%" stop-color="#a78bfa"/>
                <stop offset="100%" stop-color="#f472b6"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h2>No files yet</h2>
        <p>Drop PDF or TXT files into the upload zone or into SEFS_ROOT to see them self-organize</p>
      </div>
    </main>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
